<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nak Ai</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        /* វីដេអូ និងរូបភាព Background ពេញអេក្រង់ */
        #bgVideo, #bgImage {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            object-fit: cover;
        }

        /* ផ្ទាំងកញ្ចក់ថ្លាសម្រាប់ Chat Container */
        .chat-container {
            width: 90%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-height: 600px;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: white;
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            padding-bottom: 10px;
        }

        .header-flex h3 {
            margin: 0;
            font-size: 20px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* ប៊ូតុងជ្រើសរើសរូបភាព ឬវីដេអូ */
        .bg-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            backdrop-filter: blur(5px);
            transition: 0.2s;
        }
        .bg-btn:hover { background: rgba(255, 255, 255, 0.35); }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(0, 0, 0, 0.15);
        }

        .message {
            padding: 10px 14px;
            border-radius: 14px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.4;
        }
        .user-msg {
            background: rgba(0, 123, 255, 0.75);
            backdrop-filter: blur(5px);
            color: white;
            align-self: flex-end;
        }
        .ai-msg {
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(5px);
            color: #fff;
            align-self: flex-start;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .input-group { display: flex; gap: 10px; }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            outline: none;
            color: white;
            font-size: 14px;
        }
        input[type="text"]::placeholder { color: rgba(255, 255, 255, 0.75); }

        /* ប៊ូតុង 3D ថ្លាដូចកញ្ចក់ */
        button.send-btn {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.25);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            backdrop-filter: blur(10px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.7);
            transition: all 0.2s ease;
        }
        button.send-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }
        button.send-btn:active { transform: translateY(1px); }
    </style>
</head>
<body>

<!-- វីដេអូ Background ដើម -->
<video autoplay muted loop playsinline id="bgVideo">
    <source src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-1610-large.mp4" type="video/mp4">
</video>
<img id="bgImage" style="display:none;" />

<div class="chat-container">
    <div class="header-flex">
        <h3>Nak Ai</h3>
        <!-- ប៊ូតុងជ្រើសរើសរូបភាព ឬ វីដេអូពីក្នុងម៉ាស៊ីន -->
        <input type="file" id="bgInput" accept="image/*,video/*" style="display: none;" onchange="loadBackground(event)">
        <button class="bg-btn" onclick="document.getElementById('bgInput').click()">ដាក់រូប / VDO</button>
    </div>

    <div id="chatBox" class="chat-box">
        <div class="message ai-msg">សួស្ដី! ខ្ញុំជា Nak Ai តើខ្ញុំអាចជួយអ្វីអ្នកថ្ងៃនេះ?</div>
    </div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="សួរសំណួរអ្វីមួយ..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">បញ្ជូន</button>
    </div>
</div>

<script>
    // មុខងារប្ដូរ Background ពីទូរស័ព្ទ ឬកុំព្យូទ័រ (គាំទ្រទាំងរូបភាព និងវីដេអូ)
    function loadBackground(event) {
        const file = event.target.files[0];
        if (!file) return;

        const fileURL = URL.createObjectURL(file);
        const videoEl = document.getElementById('bgVideo');
        const imgEl = document.getElementById('bgImage');

        if (file.type.startsWith('video/')) {
            imgEl.style.display = 'none';
            videoEl.style.display = 'block';
            videoEl.src = fileURL;
            videoEl.play();
        } else if (file.type.startsWith('image/')) {
            videoEl.style.display = 'none';
            videoEl.pause();
            imgEl.style.display = 'block';
            imgEl.src = fileURL;
        }
    }

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const userText = inputField.value.trim();

        if (!userText) return;

        chatBox.innerHTML += `<div class="message user-msg">${userText}</div>`;
        inputField.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        const apiKey = "ใส่_API_Key_របស់អ្នកទីនេះ"; 
        const baseURL = "https://api.experientiallabs.ai/v1/chat/completions";

        try {
            const response = await fetch(baseURL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "gpt-6-luna",
                    messages: [{ role: "user", content: userText }]
                })
            });

            const data = await response.json();
            const aiReply = data.choices[0].message.content;

            chatBox.innerHTML += `<div class="message ai-msg">${aiReply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

        } catch (error) {
            chatBox.innerHTML += `<div class="message ai-msg" style="color:#ff8080;">មានបញ្ហាក្នុងការតភ្ជាប់ API! សូមពិនិត្យ API Key ម្ដងទៀត។</div>`;
        }
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>
